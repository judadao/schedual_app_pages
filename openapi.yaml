openapi: 3.1.1
info:
  title: Rosterly Web and Development REST API
  version: 1.0.0
  description: Generated from scheduling operations and actual SaaS route declarations. Local REST uses /api; SaaS
    scheduling uses /api/scheduling with a selected store and session cookie. GitHub Pages itself is a static offline
    client and does not host these services. Long scheduling jobs use the SaaS job API. File picker, printing,
    navigation and OS sharing remain device interactions; their data and business operations use the documented APIs.
servers:
  - url: http://localhost:5173
    description: Local REST / frontend proxy
  - url: http://localhost:3000
    description: SaaS API
